name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PMD_TODAY: "2026-10-26"

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pmd
          POSTGRES_PASSWORD: pmd
          POSTGRES_DB: pmd
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pmd" --health-interval 5s --health-retries 10
    env:
      PMD_DATABASE_URL: postgresql+psycopg://pmd:pmd@localhost:5432/pmd
      PMD_TEST_DATABASE_URL: postgresql+psycopg://pmd:pmd@localhost:5432/pmd_test
      PMD_KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Redpanda for the payment topic
        run: |
          docker run -d --name redpanda -p 9092:9092 redpandadata/redpanda:v24.2.7 \
            redpanda start --mode dev-container --smp 1 --overprovisioned \
            --kafka-addr PLAINTEXT://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://localhost:9092
          for i in $(seq 1 60); do docker exec redpanda rpk cluster health | grep -q 'Healthy:.*true' && break; sleep 1; done
      - name: Test database
        run: PGPASSWORD=pmd psql -h localhost -U pmd -d pmd -c "create database pmd_test"
      - name: Lint and types
        run: |
          ruff check src tests dags
          ruff format --check src tests dags
          mypy src
      - name: Tests (PostgreSQL, dbt, Kafka)
        run: pytest -q -m "not airflow"
      - name: The whole pipeline on simulated sources, twice
        run: |
          pmd-sim
          python -m pmd_sim.publish --bootstrap localhost:9092
          pmd run
          pmd run
          pmd evaluate
      - name: Held-out first runs are never rewritten
        run: |
          for set in heldout/*/; do
            name=$(basename "$set")
            if [ -f "reports/heldout/$name/first_run.json" ]; then
              pmd heldout "$name"
              git diff --exit-code "reports/heldout/$name/first_run.json"
            fi
          done

  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Airflow 3 with its constraints, then the platform
        run: |
          pip install "apache-airflow==3.3.2" \
            --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.13.txt
          pip install -e ".[dev]"
      - name: The DAG loads and matches the task graph
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: pytest -q -m airflow tests/test_flow.py

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [platform, console]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pmd
          POSTGRES_PASSWORD: pmd
          POSTGRES_DB: pmd
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pmd" --health-interval 5s --health-retries 10
    env:
      PMD_DATABASE_URL: postgresql+psycopg://pmd:pmd@localhost:5432/pmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -e .
      - name: Simulated sources and two published runs
        run: |
          pmd-sim
          pmd run
          pmd run
      - working-directory: web
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Start the API and console
        run: |
          nohup pmd serve --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/api/health && break; sleep 1; done
      - working-directory: web
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            web/playwright-report
            serve.log

  image:
    runs-on: ubuntu-latest
    needs: [platform, console]
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and run the stack once
        run: |
          docker compose build
          docker compose up -d api
          for i in $(seq 1 180); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/api/health | grep -q '"published"'
          curl -sf localhost:8000/api/overview > /dev/null
          curl -sf localhost:8000/funds/KES4 | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs
